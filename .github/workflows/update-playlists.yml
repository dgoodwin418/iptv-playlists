name: Update IPTV Playlists

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'update.py'
      - 'test_providers.py'
      - 'provider-notes.json'
      - '.github/workflows/update-playlists.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional private/candidate playlist URLs. Leave the GitHub Secrets unset
      # if you only want the public sources from sources.json.
      IPTV_PRIVATE_SOURCE_107: ${{ secrets.IPTV_PRIVATE_SOURCE_107 }}
      IPTV_PRIVATE_SOURCE_109: ${{ secrets.IPTV_PRIVATE_SOURCE_109 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test providers automatically
        run: python test_providers.py

      - name: Download sources and generate playlists
        run: python update.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv.m3u guide.xml dashboard-data.json provider-health.json stream-health.json stream-failures.json playlists reports
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update IPTV playlists from remote sources"
          git push
