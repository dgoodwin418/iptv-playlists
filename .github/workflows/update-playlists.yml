name: Update IPTV Playlists

on:
  schedule:
    - cron: "0 10 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test providers automatically
        run: python test_providers.py

      - name: Generate playlists and reports
        run: python update.py

      - name: Show update summary
        run: |
          echo "Provider playlists:"
          find playlists/by-provider -type f -name "*.m3u" | wc -l

          echo "Generated reports:"
          find reports -type f | sort

          echo "Automated provider statuses:"
          python - <<'PY'
          import json
          from collections import Counter
          data = json.load(open("provider-health.json", encoding="utf-8"))
          print(Counter(item["auto_status"] for item in data.values()))
          PY

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            playlists \
            reports \
            provider-notes.json \
            provider-health.json \
            stream-failures.json \
            provider-report.md \
            tv.m3u \
            working.m3u \
            priority.m3u \
            dashboard-data.json \
            index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-test providers and update IPTV playlists"
            git push
          fi
